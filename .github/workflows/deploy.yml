name: Deploy to GitHub Pages

# A push to main is checked, built and deployed. A pull request (Dependabot's,
# say) is checked only: it never builds the deploy or deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Let an in-progress deploy finish; queue the newest one behind it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  # Lint, tests and the build. Read-only: npm install scripts and the test
  # run never hold a token that can publish the site.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      # Actions are pinned to a commit, not a tag that can be moved; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail fast if repo variables are missing
        if: github.event_name != 'pull_request'
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Repo variable VITE_SUPABASE_URL is not set"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Repo variable VITE_SUPABASE_ANON_KEY is not set"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Type-checked on every event, pull requests included: Vitest and the
      # e2e build strip types without checking them.
      - run: npx tsc -b

      - run: npm test

      # The e2e suite builds its own copy pointed at a fake Supabase, so the
      # deploy build below still gets the real URL from the repo variables.
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7

      - if: github.event_name != 'pull_request'
        run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  # Publishes what the build job made, and nothing else runs with this token.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
