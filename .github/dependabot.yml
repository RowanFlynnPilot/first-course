# Weekly pull requests for outdated packages and actions. Each one runs the
# full check (lint, type check, unit and e2e tests); merge it once that
# passes. None deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # A release has a week to be found out (a hijacked package is usually
    # pulled within days) before a pull request proposes it.
    cooldown:
      default-days: 7
    groups:
      # Minor and patch updates of the dev tools in one pull request, so a
      # week's small updates are one review. A major update comes on its own,
      # so one that breaks the build does not hold back the rest.
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The types describe the Node that CI runs (24, in deploy.yml). A new
      # major would type-check code that the runtime does not have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
