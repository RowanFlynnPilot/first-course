<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="First Course" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F4F1" />
    <!-- The enamel and the pixel art are drawn for a light page: a browser that forces dark mode leaves them alone. -->
    <meta name="color-scheme" content="light only" />
    <title>First Course</title>
    <link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- Shown until the app's script runs, so a slow phone sees words, not a blank page. React replaces it.
         The built page links the stylesheet before the script, so .status is styled; no inline style, which the
         content security policy would refuse. -->
    <div id="root"><p class="status">Loading…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
